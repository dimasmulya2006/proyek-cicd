<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyek CI/CD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="badge">GitHub Actions</div>

            <h1 id="judul">Selamat Datang</h2>

            <p>
                Website sederhana untuk praktikum
                Continuous Integration (CI)
                menggunakan GitHub Actions.
            </p>

            <div class="status">
                <span class="status-dot"></span>
                Proyek Web Statis
            </div>

            <button id="tombol" type="button">
                Klik di Sini
            </button>

            <p id="pesan"></p>

            <div class="footer">
                Praktikum Dasar Komputasi Awan
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
